name: CI

# Runs the whole test suite on every push to main and on every pull request.
# Windows runner on purpose: the database tests use SQL Server LocalDB, which only exists on Windows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The tests connect to (localdb)\MSSQLLocalDB. Make sure that instance exists and is running.
      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb info
          if ((sqllocaldb info) -notcontains 'MSSQLLocalDB') { sqllocaldb create MSSQLLocalDB }
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore JobTracker.sln

      - name: Build
        run: dotnet build JobTracker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JobTracker.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python guard tests
        run: python -m unittest discover -s scripts/tests -v

      # Cross-language check: a snapshot written by the C# exporter must pass the Python upload guard.
      # Nothing is uploaded: --dry-run validates only. Uses the synthetic demo database on LocalDB.
      - name: Demo lane smoke test (C# export passes the Python guard)
        shell: pwsh
        run: |
          dotnet run --project src/JobTracker.Tools --configuration Release --no-build -- seed-demo --reset
          dotnet run --project src/JobTracker.Tools --configuration Release --no-build -- export-snapshot
          $folder = Get-ChildItem snapshots -Directory | Select-Object -First 1
          python scripts/upload_snapshot.py $folder.FullName --dry-run

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
